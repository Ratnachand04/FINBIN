apiVersion: 1

datasources:
  - name: BINFIN-Prometheus
    uid: binfin-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: BINFIN-Postgres
    uid: binfin-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: binfin
    isDefault: false
    editable: true
    jsonData:
      database: binfin
      sslmode: disable
      postgresVersion: 1400
      timescaledb: true
    secureJsonData:
      password: binfin
