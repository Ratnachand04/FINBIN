services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: binfin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-binfin}
      POSTGRES_USER: ${POSTGRES_USER:-binfin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binfin}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 4g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      - binfin_net

  redis:
    image: redis:7-alpine
    container_name: binfin-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - binfin_net

  ollama:
    image: ollama/ollama:latest
    container_name: binfin-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./models:/models
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 24g
    cpus: "6.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - binfin_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binfin-backend
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: binfin-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-binfin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binfin}
      POSTGRES_DB: ${POSTGRES_DB:-binfin}
      REDIS_HOST: binfin-redis
      REDIS_PORT: 6379
      OLLAMA_URL: http://ollama:11434
      RAG_OLLAMA_URL: http://ollama:11434
      RAG_OLLAMA_MODEL: ${RAG_OLLAMA_MODEL:-binfin-custom}
      RAG_CONTEXT_DEVICE: ${RAG_CONTEXT_DEVICE:-cpu}
      RAG_CONTEXT_CPU_ONLY: ${RAG_CONTEXT_CPU_ONLY:-true}
      RAG_CONTEXT_TIMEOUT_SECONDS: ${RAG_CONTEXT_TIMEOUT_SECONDS:-5}
      RAG_GENERATION_TIMEOUT_SECONDS: ${RAG_GENERATION_TIMEOUT_SECONDS:-60}
      CUDA_VISIBLE_DEVICES: ""
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./processing:/app/processing:ro
      - ./frontend/public:/app/frontend/public:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5).read()\" || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      - binfin_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: binfin-frontend
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      WS_SIGNALS_URL: ws://backend:8000/api/v1/signals/ws/notifications
    ports:
      - "8501:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped
    networks:
      - binfin_net

  prometheus:
    image: prom/prometheus:latest
    container_name: binfin-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - binfin_net

  grafana:
    image: grafana/grafana:latest
    container_name: binfin-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - postgres
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - binfin_net

  llm-trainer:
    profiles: ["llm-train"]
    build:
      context: ./llm_trainer
      dockerfile: Dockerfile
    container_name: binfin-llm-trainer
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./llm_trainer:/workspace
      - ./models:/models
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - binfin_net

networks:
  binfin_net:
    name: binfin-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  prometheus_data:
  grafana_data:
